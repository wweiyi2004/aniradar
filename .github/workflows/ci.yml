name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: test + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Prisma client 生成（typecheck/web 依赖 @prisma/client）
      - name: Prisma generate
        run: pnpm db:generate
        env:
          DATABASE_URL: file:../../../data/aniradar-ci.db

      - name: Prettier check
        run: pnpm format:check

      - name: Unit + SQLite integration tests
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck
        env:
          DATABASE_URL: file:../../../data/aniradar-ci.db

      - name: Production build
        run: pnpm build
        env:
          DATABASE_URL: file:../../../data/aniradar-ci.db
          ADMIN_PASSWORD: ci-only
